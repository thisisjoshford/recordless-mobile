[package]
name = "recordless_core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Recordless core: in-memory speech, scrubbing, attested private cloud notes, encrypted vault"

[lib]
crate-type = ["staticlib", "lib"]
name = "recordless_core"

[dependencies]
uniffi = { workspace = true }
thiserror = "2"
zeroize = "1.8"
regex = "1.11"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Speech. Stock whisper-rs-sys builds whisper.cpp with its own ggml; Metal is
# compiled in and `use_gpu` picks it at runtime.
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }
# Encrypted vault (SQLCipher, statically linked with a vendored OpenSSL).
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }

# Private cloud notes (NEAR AI in a TEE), ported from desktop summary/nearai.
# TLS is rustls + ring with the webpki root set, never the system store.
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
dcap-qvl = { version = "0.6", default-features = false, features = ["std", "ring", "default-x509"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
x509-parser = "0.17"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
socket2 = "0.6"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
jsonwebtoken = "9"
hex = "0.4"
urlencoding = "2"
serde_yaml_ng = "0.10"
url = "2.5"
rand = "0.8"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
