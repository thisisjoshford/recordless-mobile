<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#283962}a:hover{color:#1B2D55}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBFAF7; color: #111827; font-family: 'Source Sans 3', -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; min-height: 0; padding: 62px 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <header style="display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 700">Notes</h1>
      <label style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; background: #F4F1EB; cursor: text">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6C6660" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="search" placeholder="Search notes" aria-label="Search notes" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font-family: inherit; font-size: 17px; color: #111827; outline: none">
      </label>
      <p style="margin: 0; font-size: 13px; color: #6C6660">Searches your notes only — transcripts are never kept.</p>
    </header>

    <section aria-labelledby="sec-today" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="sec-today" style="margin: 4px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6C6660">Today</h2>
      <div style="background: #FFFFFF; border: 1px solid #E4DFD8; border-radius: 14px; overflow: hidden">
        <a href="Note.dc.html" style="min-height: 60px; box-sizing: border-box; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #E4DFD8; text-decoration: none; color: #111827">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 700">[Meeting title]</span>
            <span style="font-size: 13px; color: #6C6660">2:30 PM · 32 min</span>
          </span>
          <span style="padding: 2px 8px; border-radius: 999px; background: #EAEFF8; color: #283962; font-size: 12px; font-weight: 700">Draft</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6C6660" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
        <div style="min-height: 60px; box-sizing: border-box; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #E4DFD8">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 700">Untitled session</span>
            <span style="font-size: 13px; color: #3B589B; font-weight: 600">Writing notes…</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#EAEFF8" stroke-width="3"></circle><path d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="#3B589B" stroke-width="3" stroke-linecap="round"></path></svg>
        </div>
        <a href="#n" style="min-height: 60px; box-sizing: border-box; padding: 10px 14px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #111827">
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 700">[Meeting title]</span>
            <span style="font-size: 13px; color: #6C6660">9:00 AM · 18 min</span>
          </span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6C6660" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
      </div>
    </section>

    <section aria-labelledby="sec-week" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="sec-week" style="margin: 4px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6C6660">Earlier this week</h2>
      <div style="background: #FFFFFF; border: 1px solid #E4DFD8; border-radius: 14px; overflow: hidden">
        <sc-for list="{{week}}" as="n" hint-placeholder-count="3">
          <a href="#n" style="min-height: 60px; box-sizing: border-box; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-top: {{n.border}}; text-decoration: none; color: #111827">
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; font-weight: 700">[Meeting title]</span>
              <span style="font-size: 13px; color: #6C6660">{{n.meta}}</span>
            </span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6C6660" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          </a>
        </sc-for>
      </div>
    </section>
  </div>

  <nav aria-label="Tabs" style="flex-shrink: 0; height: 84px; box-sizing: border-box; padding: 8px 24px 0; background: rgba(255,255,255,0.94); border-top: 1px solid #E4DFD8; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #6C6660; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg>
      <span>Listen</span>
    </a>
    <a href="#notes" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: #283962; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 11h7M9 15h7"></path></svg>
      <span>Notes</span>
    </a>
    <a href="#settings" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: #6C6660; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>
      <span>Settings</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var metas = ['Mon · 4:00 PM · 45 min', 'Mon · 10:30 AM · 25 min', 'Sun · 6:15 PM · 12 min'];
    return {
      week: metas.map(function (m, i) { return { meta: m, border: i === 0 ? '0' : '1px solid #E4DFD8' }; })
    };
  }
}
</script>
</body>
</html>
